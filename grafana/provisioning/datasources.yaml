apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Matches global.scrape_interval. A lower value here makes Grafana ask
      # for steps Prometheus has no samples for and the lines go dotted.
      timeInterval: 15s

  - name: Traces
    uid: es-traces
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: traces-otel-*
    jsonData:
      esVersion: "8.0.0"
      timeField: "@timestamp"
      maxConcurrentShardRequests: 5

  - name: Logs
    uid: es-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: logs-otel-*
    jsonData:
      esVersion: "8.0.0"
      timeField: "@timestamp"
      logMessageField: body
      logLevelField: severity_text
