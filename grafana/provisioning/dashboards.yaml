apiVersion: 1

providers:
  - name: telemetry-stack
    type: file
    # Dashboards are files in this repo, not objects somebody edited in the UI
    # and nobody can diff. The UI is read-only for these.
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
