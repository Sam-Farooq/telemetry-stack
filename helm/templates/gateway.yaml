apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: telemetry-stack
    app.kubernetes.io/component: gateway
spec:
  # Headless on purpose. The agent's loadbalancing exporter resolves this name
  # to the pod addresses and hashes the trace id across them, which a single
  # cluster IP would defeat by load balancing per connection.
  clusterIP: None
  selector:
    app.kubernetes.io/name: telemetry-stack
    app.kubernetes.io/component: gateway
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: prom-export, port: 8889, targetPort: 8889}
    - {name: metrics, port: 8888, targetPort: 8888}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: telemetry-stack
    app.kubernetes.io/component: gateway
spec:
  # A StatefulSet rather than a Deployment: the sending queue is on disk, and a
  # restarted pod has to come back to the same volume or the queued batches are
  # orphaned. Stable names also keep the DNS set stable between rollouts.
  serviceName: {{ .Release.Name }}-gateway
  replicas: {{ .Values.gateway.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-stack
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-stack
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ .Values.gatewayConfig | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/conf/gateway.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: prom-export, containerPort: 8889}
            - {name: metrics, containerPort: 8888}
          env:
            - name: ELASTICSEARCH_URL
              value: {{ .Values.elasticsearchUrl | quote }}
          readinessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 5
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /conf}
            - {name: queue, mountPath: /var/lib/otelcol/queue}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-gateway
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.gateway.queue.storageClass }}
        storageClassName: {{ .Values.gateway.queue.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.gateway.queue.size }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  maxUnavailable: {{ .Values.gateway.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-stack
      app.kubernetes.io/component: gateway
